# ClassroomHub — production image-release overlay.
#
# Coolify uses this file as its Compose entrypoint after the cutover. It
# includes the source-build production stack and changes only the application
# image source. This keeps production persistence, health checks, resource
# limits, and runtime variables in one canonical file.
#
# API_IMAGE, DASHBOARD_IMAGE, and JOBS_IMAGE must be immutable GHCR digest
# references. The release workflow reconciles those three Coolify variables
# before it requests a deployment.

include:
  - path: docker-compose.source.yaml

services:
  db-migrate:
    image: ${API_IMAGE:?set API_IMAGE to an immutable GHCR digest reference}
    pull_policy: always

  api:
    image: ${API_IMAGE:?set API_IMAGE to an immutable GHCR digest reference}
    build: !reset null
    pull_policy: always

  dashboard:
    image: ${DASHBOARD_IMAGE:?set DASHBOARD_IMAGE to an immutable GHCR digest reference}
    build: !reset null
    pull_policy: always

  jobs:
    image: ${JOBS_IMAGE:?set JOBS_IMAGE to an immutable GHCR digest reference}
    build: !reset null
    pull_policy: always
