# ClassroomHub — production stack for the operator-run deployment.
#
# Not to be confused with docker/coolify/docker-compose.yaml, which is the
# public Coolify one-click service template: that file is self-contained,
# bundles MinIO, and lets Coolify generate secrets and domains. This file is the
# opposite — it describes one specific production deployment and refuses to boot
# on anything it cannot verify.
#
# Ownership boundaries:
#   - Owns the production application runtime only: database, cache, schema
#     migration, API, dashboard, background workers.
#   - Object storage is Cloudflare R2, not MinIO. The tenant-router Worker reads
#     signed HLS objects straight from R2, so production must write to the same
#     bucket the Worker binds to.
#   - Ingress is the host Cloudflare Tunnel, not the Coolify proxy. Both web
#     services publish on loopback only; nothing here claims 80/443.
#
# Deploy contract:
#   - Nothing is built here. GitHub Actions builds and publishes the images, the
#     deploy job pulls them onto this host, and Coolify only starts them. That
#     split exists because Coolify hardcodes `build --pull --no-cache` for
#     compose deployments: building on this machine meant a full rebuild of four
#     images on every push, on the machine that also serves the site.
#   - CLASSROOM_API_TAG, CLASSROOM_DASHBOARD_TAG and CLASSROOM_JOBS_TAG are the
#     commit each service is running. One tag per service, not one for the stack:
#     a shared tag changed on every deploy, so compose recreated every container
#     every time and a change to the teacher's screen restarted the API in the
#     middle of an exam — the process a candidate's autosaves, activity reports
#     and submission all go through. A service the deploy did not rebuild is
#     handed the tag it is already running, so its resolved config is unchanged
#     and compose leaves it alone.
#
#     `:?` rather than a default. The old default was `current`, a tag nothing
#     has ever published, so an unset variable would have failed at the pull with
#     a message about a missing image rather than about the missing variable.
#   - the deploy job exports them for
#     the one `up` command, so `docker ps` names the commit each container came
#     from. `current` is only the fallback for a hand-run `up`.
#     The dashboard topology is baked into its image at build time.
#   - Every secret and public URL is required. The stack fails to start rather
#     than booting with an empty auth secret or a wrong origin.
#   - Development values must never be reused here; production starts from an
#     empty schema with its own credentials.
#
# Persistent state lives on the internal disk, deliberately outside the Docker
# data-root on removable storage:
#   ${CLASSROOM_DATA_DIR}/postgres
#   ${CLASSROOM_DATA_DIR}/redis
# Create both before the first deploy.

services:
  postgres:
    image: postgres:16.14-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    labels:
      io.classroom.stack: production
      io.classroom.role: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classroom}
      POSTGRES_USER: ${POSTGRES_USER:-classroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD to a generated production secret}
    # Loopback only, so the database is reachable for an administrator over an SSH
    # tunnel and from nowhere else. Binding the host's tailnet address instead
    # would put production data on every device that joins the tailnet; binding
    # 0.0.0.0 would put it on the internet. Neither is worth the convenience.
    #
    #   ssh -N -L 5433:localhost:8009 <user>@<host>   then connect to localhost:5433
    ports:
      - '127.0.0.1:8009:5432'
    volumes:
      - /data/classroomhub-production/postgres:/var/lib/postgresql/data
    healthcheck:
      # Require a real query: pg_isready can pass while the server is still in
      # recovery, which surfaces as 57P03 on the first sign-in after a restart.
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-classroom} -d ${POSTGRES_DB:-classroom} && psql -U ${POSTGRES_USER:-classroom} -d ${POSTGRES_DB:-classroom} -tAc 'SELECT 1'",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    stop_grace_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 2G

  redis:
    image: redis:7.4.9-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    labels:
      io.classroom.stack: production
      io.classroom.role: redis
    # Append-only so queued jobs survive a restart; a lost queue means lost
    # transcodes, transcriptions, and outbound email.
    # `noeviction` because these are jobs: dropping a key to make room loses work that
    # nobody knows was lost. The bound sits below the container limit so a full queue
    # refuses writes with an error somebody can read, instead of being killed mid-write
    # and coming back to replay its append-only file.
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory",
        "1600mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - /data/classroomhub-production/redis:/data
    healthcheck:
      # Measured on this deployment: `PING` answers `LOADING` for the whole of a restart —
      # twenty-one seconds to read a base RDB of 370,000 keys plus its incremental files —
      # so the probe fails for that entire window. The old allowance of ten seconds of
      # grace plus a hundred of retries was not always enough, and a deploy failed with
      # `dependency failed to start: redis is unhealthy` while Redis was merely still
      # loading. `INFO persistence` is answered during loading and states the truth, so the
      # probe asks it too rather than trusting `PING` alone across versions.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli INFO persistence | grep -q '^loading:0'"]
      interval: 10s
      timeout: 5s
      # The append-only file is measured in gigabytes and a cold load reads all of it. The
      # window is sized for that rather than for the warm restart that is easy to observe:
      # three minutes of grace, then two more minutes of retries before it is called dead.
      retries: 12
      start_period: 180s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # Redis reported a 525 MB dataset while capped at 512 MB: the data did not fit
          # its own limit, so every append-only rewrite forked into a wall and the
          # container restarted — 1,848 times before anybody counted. Sized for the
          # working set plus the copy-on-write a rewrite needs.
          memory: 2G

  # Schema migration runs once per deploy, before any app process serves traffic.
  # Keeping it out of the API entrypoint means a failed migration blocks the
  # release instead of leaving the API half-migrated.
  # `restart: "no"` also tells Coolify this container is not part of stack health.
  db-migrate:
    # The API image, so the applied schema always matches the API that serves it.
    image: ghcr.io/tedydev-web/classroom-api:${CLASSROOM_API_TAG:?set by the deploy}
    labels:
      io.classroom.stack: production
      io.classroom.role: db-migrate
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["pnpm", "--filter", "@cio/db", "db:setup"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-classroom}
      PRIVATE_DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-classroom}
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    image: ghcr.io/tedydev-web/classroom-api:${CLASSROOM_API_TAG:?set by the deploy}
    labels:
      io.classroom.stack: production
      io.classroom.role: api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    ports:
      # Loopback only — the host Cloudflare Tunnel is the sole public path.
      - "127.0.0.1:${HOST_API_PORT:-18001}:3081"
    environment:
      NODE_ENV: production
      PORT: 3081
      # Migration already ran in db-migrate; the entrypoint must not repeat it.
      SKIP_DB_SETUP: "true"

      # Self-owned multi-tenant platform: no upstream licence check, no single-org lock.
      PUBLIC_IS_SELFHOSTED: "false"
      PUBLIC_IS_SELF_OWNED: "true"

      DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-classroom}
      REDIS_URL: redis://redis:6379

      # Public identity. PUBLIC_SERVER_URL is the API's own canonical host, not
      # the dashboard's — clients build API calls from it.
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL:?set PUBLIC_SERVER_URL to the public API origin}
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN to the public dashboard origin}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-${DASHBOARD_ORIGIN}}

      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET to a generated production secret}
      PRIVATE_SERVER_KEY: ${PRIVATE_SERVER_KEY:?set PRIVATE_SERVER_KEY to a generated production secret}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?set WEBHOOK_ENCRYPTION_KEY to a generated production secret}
      # Must match the tenant-router Worker secret, or signed HLS playback fails.
      HLS_SIGNING_SECRET: ${HLS_SIGNING_SECRET:?set HLS_SIGNING_SECRET to the value shared with the tenant-router Worker}

      # Cloudflare R2. Virtual-hosted addressing, so path style stays off.
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?set OBJECT_STORAGE_ENDPOINT to the R2 S3 API endpoint}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set OBJECT_STORAGE_PUBLIC_ENDPOINT to the R2 S3 API endpoint}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID for the R2 token}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY for the R2 token}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL: ${OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL:?set OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL to the R2 media custom domain}
      # Browser Rendering, which the certificate PDF, the course PDF and the organisation's
      # OG image all go through. Both values live in the host env file; this list is a
      # whitelist rather than an `env_file`, so a variable not named here does not exist
      # inside the container, and those three features fail on a "not configured" guard.
      # Optional on purpose: a deployment without them still starts, and only those three
      # refuse.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_RENDERING_API_KEY: ${CLOUDFLARE_RENDERING_API_KEY:-}
      # Gate on the super-admin endpoints, which the operator console in `apps/admin`
      # is the only caller of. Empty means the gate stays shut: the middleware refuses
      # every request with a 503 rather than admitting one, so an unset value cannot be
      # mistaken for an open door.
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      OBJECT_STORAGE_BUCKET_VIDEOS: ${OBJECT_STORAGE_BUCKET_VIDEOS:-videos}
      OBJECT_STORAGE_BUCKET_DOCUMENTS: ${OBJECT_STORAGE_BUCKET_DOCUMENTS:-documents}
      OBJECT_STORAGE_BUCKET_MEDIA: ${OBJECT_STORAGE_BUCKET_MEDIA:-media}

      # Email is a go-live requirement: verification, password reset, and invites
      # all depend on it.
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST for the production mail provider}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT for the production mail provider}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER for the production mail provider}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD for the production mail provider}
      SMTP_SENDER: ${SMTP_SENDER:?set SMTP_SENDER to the verified sender address}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}

      UPLOAD_MAX_DOCUMENT_MB: ${UPLOAD_MAX_DOCUMENT_MB:-}
      UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-}
      UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-}
      UPLOAD_MAX_EXERCISE_FILE_MB: ${UPLOAD_MAX_EXERCISE_FILE_MB:-}
      UPLOAD_MAX_AGENT_DOCUMENT_MB: ${UPLOAD_MAX_AGENT_DOCUMENT_MB:-}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      UNSPLASH_API_KEY: ${UNSPLASH_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_GATEWAY_AUTH_TOKEN: ${AI_GATEWAY_AUTH_TOKEN:-}

      # The public timed exam feature. Off unless set, so the routes answer 404
      # rather than existing half-configured.
      EXAM_ENABLED: ${EXAM_ENABLED:-false}
      EXAM_IMPORT_ENABLED: ${EXAM_IMPORT_ENABLED:-false}
      EXAM_IMPORT_PDF_ENABLED: ${EXAM_IMPORT_PDF_ENABLED:-false}
      EXAM_IMPORT_AI_ENABLED: ${EXAM_IMPORT_AI_ENABLED:-false}
      EXAM_IMPORT_AI_MODEL: ${EXAM_IMPORT_AI_MODEL:-}
    healthcheck:
      # node:slim ships no curl/wget; use the runtime's own fetch.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3081/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  dashboard:
    image: ghcr.io/tedydev-web/classroom-dashboard:${CLASSROOM_DASHBOARD_TAG:?set by the deploy}
    labels:
      io.classroom.stack: production
      io.classroom.role: dashboard
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_DASHBOARD_PORT:-18000}:3082"
    environment:
      NODE_ENV: production
      PORT: 3082
      ORIGIN: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN to the public dashboard origin}

      # Runtime copy of the build-time topology. The image is built with these
      # same values; a mismatch here means the wrong image is deployed.
      PUBLIC_IS_SELFHOSTED: "false"
      PUBLIC_IS_SELF_OWNED: "true"
      PUBLIC_EXAM_IMPORT_ENABLED: ${PUBLIC_EXAM_IMPORT_ENABLED:-false}
      PUBLIC_EXAM_IMPORT_PDF_ENABLED: ${PUBLIC_EXAM_IMPORT_PDF_ENABLED:-false}
      # Gates the Google social button — it shows only when this is set. Read at
      # runtime via $env/dynamic/public, so no rebuild is needed to flip it. Not
      # a secret: OAuth client ids are public, so it rides as plain runtime env.
      PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}

      # Server-to-server call stays on the stack network, never over the tunnel.
      PRIVATE_SERVER_URL: http://api:3081
      PRIVATE_SERVER_KEY: ${PRIVATE_SERVER_KEY:?set PRIVATE_SERVER_KEY to a generated production secret}

      # Tenant resolution: subdomains of PRIVATE_APP_HOST map to org sites,
      # except the reserved app subdomains.
      PRIVATE_APP_HOST: ${PRIVATE_APP_HOST:?set PRIVATE_APP_HOST to the tenant root domain}
      PRIVATE_APP_SUBDOMAINS: ${PRIVATE_APP_SUBDOMAINS:-app}
      # Host-authoritative tenancy (dark-launched). Off unless ENFORCE_TENANT_HOST=true.
      # PLATFORM_ADMIN_EMAILS is the operator allowlist exempt from the bounce.
      ENFORCE_TENANT_HOST: ${ENFORCE_TENANT_HOST:-}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:-}

      ALLOWED_EXTERNAL_DOMAINS: ${ALLOWED_EXTERNAL_DOMAINS:-}
      CSP_SCRIPT_SRC_DOMAINS: ${CSP_SCRIPT_SRC_DOMAINS:-}
      CSP_STYLE_SRC_DOMAINS: ${CSP_STYLE_SRC_DOMAINS:-}
      CSP_CONNECT_SRC_DOMAINS: ${CSP_CONNECT_SRC_DOMAINS:-${PUBLIC_SERVER_URL}}
      CSP_FRAME_SRC_DOMAINS: ${CSP_FRAME_SRC_DOMAINS:-}
      CSP_FONT_SRC_DOMAINS: ${CSP_FONT_SRC_DOMAINS:-}
      # Media loads from the R2 custom domain, so it must be allowed explicitly.
      CSP_MEDIA_SRC_DOMAINS: ${CSP_MEDIA_SRC_DOMAINS:-${OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL}}

      UPLOAD_MAX_DOCUMENT_MB: ${UPLOAD_MAX_DOCUMENT_MB:-}
      UPLOAD_MAX_IMAGE_MB: ${UPLOAD_MAX_IMAGE_MB:-}
      UPLOAD_MAX_VIDEO_MB: ${UPLOAD_MAX_VIDEO_MB:-}
      UPLOAD_MAX_EXERCISE_FILE_MB: ${UPLOAD_MAX_EXERCISE_FILE_MB:-}
      UPLOAD_MAX_AGENT_DOCUMENT_MB: ${UPLOAD_MAX_AGENT_DOCUMENT_MB:-}
      UPLOAD_MAX_LANDING_IMAGE_MB: ${UPLOAD_MAX_LANDING_IMAGE_MB:-}
      UPLOAD_MAX_THUMBNAIL_MB: ${UPLOAD_MAX_THUMBNAIL_MB:-}
    healthcheck:
      # Any non-5xx proves the SvelteKit server is listening and routing.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3082/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  # BullMQ workers: video processing, transcription, AI course generation, email,
  # and notifications. Without this service those queues fill up silently.
  jobs:
    image: ghcr.io/tedydev-web/classroom-jobs:${CLASSROOM_JOBS_TAG:?set by the deploy}
    labels:
      io.classroom.stack: production
      io.classroom.role: jobs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PUBLIC_IS_SELFHOSTED: "false"
      PUBLIC_IS_SELF_OWNED: "true"

      DATABASE_URL: postgresql://${POSTGRES_USER:-classroom}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-classroom}
      REDIS_URL: redis://redis:6379

      # Workers build absolute links for outbound email; without this they would
      # fall back to a non-production host.
      DASHBOARD_ORIGIN: ${DASHBOARD_ORIGIN:?set DASHBOARD_ORIGIN to the public dashboard origin}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?set WEBHOOK_ENCRYPTION_KEY to a generated production secret}

      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:?set OBJECT_STORAGE_ENDPOINT to the R2 S3 API endpoint}
      OBJECT_STORAGE_PUBLIC_ENDPOINT: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:?set OBJECT_STORAGE_PUBLIC_ENDPOINT to the R2 S3 API endpoint}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-auto}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?set OBJECT_STORAGE_ACCESS_KEY_ID for the R2 token}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?set OBJECT_STORAGE_SECRET_ACCESS_KEY for the R2 token}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-false}
      OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL: ${OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL:?set OBJECT_STORAGE_MEDIA_PUBLIC_BASE_URL to the R2 media custom domain}
      OBJECT_STORAGE_BUCKET_VIDEOS: ${OBJECT_STORAGE_BUCKET_VIDEOS:-videos}
      OBJECT_STORAGE_BUCKET_DOCUMENTS: ${OBJECT_STORAGE_BUCKET_DOCUMENTS:-documents}
      OBJECT_STORAGE_BUCKET_MEDIA: ${OBJECT_STORAGE_BUCKET_MEDIA:-media}

      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST for the production mail provider}
      SMTP_PORT: ${SMTP_PORT:?set SMTP_PORT for the production mail provider}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER for the production mail provider}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?set SMTP_PASSWORD for the production mail provider}
      SMTP_SENDER: ${SMTP_SENDER:?set SMTP_SENDER to the verified sender address}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}

      # Conservative defaults: this host is also a desktop workstation. Raise
      # these only after observing real CPU, memory, and disk load.
      MEDIA_WORKER_CONCURRENCY: ${MEDIA_WORKER_CONCURRENCY:-1}
      TRANSCRIBE_WORKER_CONCURRENCY: ${TRANSCRIBE_WORKER_CONCURRENCY:-1}
      AGENT_COURSE_GENERATION_WORKER_CONCURRENCY: ${AGENT_COURSE_GENERATION_WORKER_CONCURRENCY:-1}
      EMAIL_WORKER_CONCURRENCY: ${EMAIL_WORKER_CONCURRENCY:-2}

      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      AI_GATEWAY_BASE_URL: ${AI_GATEWAY_BASE_URL:-}
      AI_GATEWAY_AUTH_TOKEN: ${AI_GATEWAY_AUTH_TOKEN:-}
      EXAM_IMPORT_AI_ENABLED: ${EXAM_IMPORT_AI_ENABLED:-false}
      EXAM_IMPORT_AI_MODEL: ${EXAM_IMPORT_AI_MODEL:-}
      EXAM_IMPORT_VISION_ENABLED: ${EXAM_IMPORT_VISION_ENABLED:-false}
      EXAM_IMPORT_VISION_MODEL: ${EXAM_IMPORT_VISION_MODEL:-}
    healthcheck:
      # A fresh heartbeat proves both the worker process and its Redis dependency
      # are usable. A PID-only check would report healthy while queues are stuck.
      test: ["CMD", "node", "-e", "const fs=require('node:fs');const age=Date.now()-fs.statSync('/tmp/classroomhub-jobs-health').mtimeMs;if(age>45000)process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 45s
    # Long grace period so an in-flight transcode or upload can finish instead of
    # being killed and retried from scratch.
    stop_grace_period: 90s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  # The operator console. Reads the super-admin endpoints and nothing else, so it
  # needs no database, no Redis and no object storage — only a route to the API on
  # the stack network.
  #
  # Published on loopback like every other service: the tunnel is the sole public
  # path, and Cloudflare Access sits in front of the hostname so the console's own
  # password is the second gate rather than the only one.
  admin:
    image: ghcr.io/tedydev-web/classroom-admin:${CLASSROOM_ADMIN_TAG:?set by the deploy}
    labels:
      io.classroom.stack: production
      io.classroom.role: admin
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HOST_ADMIN_PORT:-18002}:3083"
    environment:
      NODE_ENV: production
      PORT: 3083
      # Server-to-server, on the stack network — the console's `/api/*` proxy never
      # leaves the host, so the operator's key does not travel over the tunnel.
      PRIVATE_SERVER_URL: http://api:3081
    healthcheck:
      # Any non-5xx proves the SvelteKit server is listening and routing.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3083/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

# The AI gateway runs on the host, so a container reaches it across the docker
# bridge and the host firewall admits that bridge by subnet. Left to Docker the
# subnet is assigned dynamically, and it changed the last time this network was
# recreated — silently stranding every AI call behind a firewall rule that still
# named the old range. Pinned so the rule and the network cannot drift apart.
networks:
  default:
    ipam:
      config:
        - subnet: 172.18.0.0/16
