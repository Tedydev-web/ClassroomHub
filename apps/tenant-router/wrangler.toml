name = "classroom-tenant-router"
account_id = "da02bc7e271f6874328a990774afac5e"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Production routes — bind the Worker to every browser-facing host.
# Tenant subdomains and platform hosts live on the `tedydev.io.vn` zone.
# The admin app is routed through the Worker so
# it can use same-origin `/api/*` paths with host-only auth cookies.
routes = [
  { pattern = "classroom.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "*.classroom.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-learn.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-app.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-play.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-embed.tedydev.io.vn/*", zone_name = "tedydev.io.vn" }
]

# Override per environment. Origins must bypass this Worker to prevent loops.
[vars]
DASHBOARD_UPSTREAM_HOST = "dashboard-origin.tedydev.io.vn"
API_UPSTREAM_HOST = "api-origin.tedydev.io.vn"
APEX_REDIRECT_HOST = "classroom-learn.tedydev.io.vn"
APEX_REDIRECT_TARGET = "https://classroom.tedydev.io.vn"
EMBED_HOST = "classroom-embed.tedydev.io.vn"
API_URL = "https://classroom-api.tedydev.io.vn"

# R2 bucket binding so /hls/* can stream segments directly from Cloudflare,
# bypassing Render. The bucket name matches the storage config in
# packages/agent-runtime/src/config/storage.ts (BUCKET_DEFAULTS.VIDEOS).
[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "videos"

# Public embed scripts (course-widget, question-type-picker) uploaded by apps/embeds.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "assets"

# HLS_SIGNING_SECRET is set via `wrangler secret put HLS_SIGNING_SECRET` —
# never commit it. The same value must be set as HLS_SIGNING_SECRET on the
# API so the cookie minted by the API verifies on the Worker.

[observability]
enabled = true
