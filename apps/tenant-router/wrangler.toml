name = "classroom-tenant-router"
account_id = "da02bc7e271f6874328a990774afac5e"
main = "src/index.ts"
compatibility_date = "2026-05-01"

# Two deployments from one source: the top level serves the development stack on
# tedydev.io.vn, `[env.production]` serves classroom.io.vn as a separate Worker
# (`classroom-tenant-router-production`).
#
# They cannot share one config. `wrangler deploy` reconciles routes against what
# is listed, so a single config would strip the routes of whichever zone it did
# not name — and each environment needs its own upstream hosts, which live in
# `vars` and so cannot be shared either.

routes = [
  { pattern = "classroom.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "*.classroom.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-learn.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-app.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-play.tedydev.io.vn/*", zone_name = "tedydev.io.vn" },
  { pattern = "classroom-embed.tedydev.io.vn/*", zone_name = "tedydev.io.vn" }
]

[vars]
DASHBOARD_UPSTREAM_HOST = "dashboard-origin.tedydev.io.vn"
API_UPSTREAM_HOST = "api-origin.tedydev.io.vn"
APEX_REDIRECT_HOST = "classroom-learn.tedydev.io.vn"
APEX_REDIRECT_TARGET = "https://classroom.tedydev.io.vn"
EMBED_HOST = "classroom-embed.tedydev.io.vn"
ASSET_HOST = "assets.classroom.tedydev.io.vn"
API_URL = "https://classroom-api.tedydev.io.vn"

# R2 binding so /hls/* streams segments straight from Cloudflare. The bucket name
# matches BUCKET_DEFAULTS.VIDEOS in the storage config.
[[r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "videos"

# Public embed scripts (course-widget, question-type-picker) uploaded by apps/embeds.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "assets"

[observability]
enabled = true

# --- production -------------------------------------------------------------
# Tenant sites and platform hosts share one label level here, and this Worker
# picks its upstream by request path rather than by host. A wildcard route would
# therefore swallow api.classroom.io.vn and forward it to the dashboard, so the
# hostnames are listed one by one and `api` stays off the Worker. Public assets
# are served from R2 by the Worker, while the API is reached through the tunnel.
#
# Adding a tenant means adding its route here and redeploying.
[env.production]

# Routes are inheritable, so leaving this out would point production at the
# development hostnames.
routes = [
  # Apex is its own route because the wildcard below only matches subdomains.
  { pattern = "classroom.io.vn/*", zone_name = "classroom.io.vn" },
  # Every subdomain, so a newly created tenant `<siteName>.classroom.io.vn` is
  # served without adding a route per org. The Worker hands `api` and the
  # internal origins straight to their origin; `assets` is served from R2.
  { pattern = "*.classroom.io.vn/*", zone_name = "classroom.io.vn" }
]

# Vars, bindings and secrets are not inherited by environments — each has to be
# restated, or the deployed Worker silently comes up without them.
[env.production.vars]
DASHBOARD_UPSTREAM_HOST = "dashboard-origin.classroom.io.vn"
API_UPSTREAM_HOST = "api-origin.classroom.io.vn"
APEX_REDIRECT_HOST = "learn.classroom.io.vn"
APEX_REDIRECT_TARGET = "https://classroom.io.vn"
EMBED_HOST = "embed.classroom.io.vn"
ASSET_HOST = "assets.classroom.io.vn"
API_URL = "https://api.classroom.io.vn"
# Service hosts the wildcard route catches but that must reach their origin
# untouched: the public API tunnel. The internal origins are added in code from
# the upstream vars above; the Worker serves the public R2 asset domain.
DIRECT_PASSTHROUGH_HOSTS = "api.classroom.io.vn"
MARKETING_HOSTS = "classroom.io.vn,www.classroom.io.vn"
MARKETING_CANONICAL_HOST = "classroom.io.vn"

[[env.production.r2_buckets]]
binding = "VIDEOS_BUCKET"
bucket_name = "videos"

[[env.production.r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "assets"

[[env.production.services]]
binding = "MARKETING"
service = "cio-web"

[env.production.observability]
enabled = true

# HLS_SIGNING_SECRET is set per environment with
# `wrangler secret put HLS_SIGNING_SECRET --env production` — never committed.
# It must equal HLS_SIGNING_SECRET on the API of the same environment, or the
# cookie the API mints will not verify here.
