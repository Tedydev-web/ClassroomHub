<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Set the theme before first paint so there is no light-to-dark flash.
      // Mirrors src/lib/theme.ts: a stored choice wins, else the OS preference.
      (function () {
        try {
          var t = localStorage.getItem('ch-admin-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ClassroomHub Admin</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
