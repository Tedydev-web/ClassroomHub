<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // Set the theme before first paint so there is no light-to-dark flash.
      // Mirrors src/lib/theme.ts: a stored choice wins, else the OS preference.
      (function () {
        try {
          var t = localStorage.getItem('ch-admin-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231D4EE2'/%3E%3Ctext x='50' y='68' font-size='58' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ClassroomHub Admin</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
