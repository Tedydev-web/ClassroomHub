packages:
  - apps/*
  - '!apps/db-agent'
  - packages/*
  - packages/course-app/src/*
onlyBuiltDependencies:
  - esbuild
  - '@tailwindcss/oxide'
# Block brand-new registry publishes for 24h (supply-chain cooldown).
# Locked versions in pnpm-lock.yaml stay installable; this gates adds/updates.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@getworkbench/hono'
  - '@getworkbench/core'
patchedDependencies:
  '@tiptap/extension-bubble-menu@3.14.0': patches/@tiptap__extension-bubble-menu@3.14.0.patch
overrides:
  zod: 4.2.1
  miniflare>zod: 3.22.3
