name: classroomio-dev

services:
  postgres:
    image: postgres:16.14-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_DB: classroomio
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d classroomio']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - classroomio-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4.9-alpine3.21
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - classroomio-redis:/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_PASSWORD: classroomio-dev-only
      MINIO_ROOT_USER: classroomio
    ports:
      - '127.0.0.1:${MINIO_API_PORT:-9000}:9000'
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - classroomio-minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 classroomio classroomio-dev-only &&
        mc mb --ignore-existing local/videos local/documents local/media &&
        mc anonymous set download local/media
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.30.4
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  classroomio-minio:
  classroomio-postgres:
  classroomio-redis:
