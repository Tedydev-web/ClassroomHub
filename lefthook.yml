# Lefthook configuration
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    prettier:
      run: pnpm format:check
      fail_text: |
        ❌ Prettier formatting check failed!
        Please run 'pnpm format:changed' or 'pnpm format' to fix formatting issues and try again.
    ui-prefix:
      glob: 'packages/ui/src/**/*.{svelte,ts,tsx,js,jsx}'
      run: pnpm --filter @cio/ui prefix:check:staged
      fail_text: |
        ❌ packages/ui Tailwind classes must use the ui: prefix.
        Run 'pnpm --filter @cio/ui prefix' to fix staged UI files, then commit again.
    # packages/ui compiles with prefix(ui), so a token utility only exists in its
    # ui:-prefixed form. Written without the prefix it emits no CSS at all and the
    # element silently renders with no colour, border or background — which had
    # already happened in 31 places across 12 files before anything caught it.
    #
    # Plain utilities (flex, text-sm, gap-2) are unaffected and must stay unprefixed,
    # so this deliberately matches the token names only, rather than reusing the
    # packages/ui script, which prefixes every Tailwind class.
    dashboard-token-prefix:
      glob: 'apps/dashboard/src/**/*.{svelte,ts}'
      run: |
        TOKENS='bg-background|bg-card|bg-muted|bg-primary|bg-secondary|bg-accent|bg-popover|bg-destructive|text-foreground|text-muted-foreground|text-primary|text-card-foreground|text-popover-foreground|text-accent-foreground|text-secondary-foreground|text-primary-foreground|border-border|border-input|ring-ring'
        if grep -nE "(^|[\"' ])((hover|focus|focus-visible|group-hover|dark|active|disabled):)?($TOKENS)([\"' ]|$)" {staged_files} | grep -v 'ui:'; then
          exit 1
        fi
        exit 0
      fail_text: |
        ❌ Token utilities in apps/dashboard must carry the ui: prefix, or they emit no CSS.
        Write ui:text-muted-foreground, and for variants put the prefix outermost:
        ui:hover:bg-accent — not hover:ui:bg-accent.
