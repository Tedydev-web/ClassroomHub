name: Deploy embeds to R2

on:
  push:
    branches: [main]
    paths:
      - "packages/ui/**"
      - "packages/question-types/**"
      - "apps/embeds/**"
  workflow_dispatch:
    inputs:
      runner_pool:
        description: Runner pool (self-hosted uses no GitHub minutes; github-hosted needs working Actions billing)
        type: choice
        options:
          - self-hosted
          - github-hosted
        default: github-hosted

permissions:
  contents: read

concurrency:
  group: deploy-embeds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy-embeds:
    runs-on: ${{ !(github.event_name == 'workflow_dispatch' && inputs.runner_pool == 'self-hosted') && 'ubuntu-latest' || fromJson('["self-hosted", "Linux", "deploy"]') }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @cio/embeds workspace dependencies
        run: pnpm turbo run build --filter=@cio/embeds^...

      - name: Build and upload embeds to R2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: pnpm --filter @cio/embeds run embeds:publish
        env:
          CLOUDFLARE_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
          CLOUDFLARE_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional: purges Cloudflare edge cache for EMBED_CDN_BASE_URL (R2 has no HTTP cache). Token needs Zone → Cache Purge → Purge.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          EMBED_CDN_BASE_URL: ${{ vars.EMBED_CDN_BASE_URL }}
