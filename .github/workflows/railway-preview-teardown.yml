name: Railway Preview Teardown

# Manually delete a preview environment created by railway-preview.yml. ClassroomHub
# keeps Railway previews opt-in: no PR-close event can delete an environment.
#
# Uses the same `railway-preview` environment secrets as the deploy workflow.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Original trusted branch name used to derive the preview environment; remains usable after branch deletion"
        required: true
        type: string

concurrency:
  group: railway-preview-${{ inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Verify this workflow runs from the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          default_branch=$(curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY" | jq -r '.default_branch // empty')
          expected_ref="refs/heads/$default_branch"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/railway-preview-teardown.yml@$expected_ref"
          if [ -z "$default_branch" ] || [ "$GITHUB_REF" != "$expected_ref" ] || [ "$WORKFLOW_REF" != "$expected_workflow_ref" ]; then
            echo "::error::Railway preview teardown may run only from this repository's default branch."
            exit 1
          fi

  validate-branch:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.ref.outputs.branch }}
    steps:
      - name: Validate trusted same-repository branch
        id: ref
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          if [ -z "$BRANCH" ] || [ "${BRANCH#refs/heads/}" != "$BRANCH" ] || [[ "$BRANCH" == refs/* || "$BRANCH" == pull/* || "$BRANCH" == *:* ]]; then
            echo "::error::Branch must be a plain branch name, not a ref, SHA, pull ref, or remote syntax."
            exit 1
          fi
          if ! git check-ref-format --branch "$BRANCH" >/dev/null; then
            echo "::error::Invalid branch name."
            exit 1
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

  teardown:
    needs: [verify-provenance, validate-branch]
    runs-on: ubuntu-latest
    environment: railway-preview
    env:
      RAILWAY_WORKSPACE: ${{ vars.RAILWAY_WORKSPACE || 'cio projects' }}
      BASE_ENV: ${{ vars.RAILWAY_BASE_ENV || 'staging' }}
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.30.1

      - name: Link to base project
        # `railway environment delete` takes no --project/--workspace/--environment
        # flags — only `railway link` does, so it must run first to establish that
        # context (same requirement as railway-preview.yml).
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
        run: |
          railway link --project "$RAILWAY_PROJECT_ID" --workspace "$RAILWAY_WORKSPACE" --environment "$BASE_ENV"

      - name: Delete the preview environment
        # Mirror the name derivation in railway-preview.yml so the env name matches.
        # HEAD_REF is bound via env (not interpolated into the script) so a supplied
        # branch name can never be executed as shell.
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          HEAD_REF: ${{ needs.validate-branch.outputs.branch }}
        run: |
          slug=$(echo "$HEAD_REF" | tr '[:upper:]/_.' '[:lower:]---' | sed 's/[^a-z0-9-]//g' | sed 's/--*/-/g; s/^-//; s/-$//' | cut -c1-18 | sed 's/-$//')
          hash=$(echo -n "$HEAD_REF" | sha256sum | cut -c1-8)
          env_name="pr-${slug}-${hash}"
          echo "Attempting to delete environment: ${env_name}"
          if ! output=$(railway environment delete "${env_name}" --yes 2>&1); then
            echo "$output"
            if echo "$output" | grep -qi "not found"; then
              echo "No matching preview environment (or already deleted) — nothing to do."
            else
              exit 1
            fi
          else
            echo "$output"
          fi
