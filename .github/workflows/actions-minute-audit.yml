name: Actions minute governance audit

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      since_days:
        description: "Lookback window in days"
        default: "1"
        required: false
      hosted_minutes_limit:
        description: "Optional fail threshold for hosted job minutes (0 = no threshold)"
        default: "0"
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: actions-minute-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      SINCE_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.since_days || '1' }}
      HOSTED_MINUTES_LIMIT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.hosted_minutes_limit || '0' }}
      REPORT_FILE: /tmp/actions-minute-audit.md
      SUMMARY_FILE: /tmp/actions-minute-summary.json
      EVENTS_FILE: /tmp/actions-minute-events.json
      TOP_COUNT: "12"
      RUN_PER_PAGE: "100"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Actions minutes audit
        id: audit
        run: bash scripts/ci/actions-minute-audit.sh

      - name: Publish markdown summary
        if: always()
        run: |
          {
            echo "## GitHub Actions minute audit"
            echo ""
            cat "$REPORT_FILE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-minute-audit-${{ github.run_id }}
          path: |
            ${{ env.REPORT_FILE }}
            ${{ env.SUMMARY_FILE }}
            ${{ env.EVENTS_FILE }}
