name: Edge and docs quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Main shares the physical host with production builds; serialize heavy
  # validation and deployment there while retaining PR cancellation.
  group: >-
    ${{ github.ref == 'refs/heads/main' && 'classroomhub-host-heavy-main' || format('edge-quality-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  docs-validation:
    name: docs-validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation, ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: apps/docs/.nvmrc
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs dependencies
        run: pnpm turbo run build --filter=@cio/docs^...

      - name: Validate docs links and anchors
        run: pnpm --filter @cio/docs validate

      - name: Build docs
        run: pnpm --filter @cio/docs build

  website-validation:
    name: website-validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation, ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Match production: the runner host is too old for Cloudflare's workerd
      # binary, while Bookworm provides the required glibc runtime.
      - name: Build website in compatible container
        run: |
          dependency_volume="classroomhub-ci-deps-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker volume create "$dependency_volume" >/dev/null
          trap 'docker volume rm "$dependency_volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm \
            --user 0:0 \
            --env HOME=/tmp \
            --env CI=true \
            --env NODE_OPTIONS=--max-old-space-size=12288 \
            --volumes-from "$HOSTNAME" \
            --volume "$dependency_volume:$GITHUB_WORKSPACE/node_modules" \
            --workdir "$GITHUB_WORKSPACE" \
            node:22-bookworm-slim \
            bash -euc '
              mkdir -p /tmp/bin
              corepack prepare pnpm@10.19.0 --activate
              corepack enable --install-directory /tmp/bin
              export PATH=/tmp/bin:$PATH
              pnpm --version
              pnpm install --frozen-lockfile
              pnpm turbo run build --filter=@cio/website^...
              pnpm --filter @cio/website check
              pnpm --filter @cio/website build
            '

  tenant-router-validation:
    name: tenant-router-validation
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation, ci]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck tenant router
        run: pnpm --filter @cio/tenant-router typecheck

      - name: Validate production Worker bundle
        run: pnpm --filter @cio/tenant-router exec wrangler deploy --env production --dry-run
