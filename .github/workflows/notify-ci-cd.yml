name: Notify CI/CD

# One Telegram message per finished workflow, in the same format as the other
# projects: status icon, elapsed time, branch, actor, the commit as a link with
# its subject, and a link to the run for the per-step logs.
#
# Listening for `workflow_run` rather than notifying from inside each workflow
# keeps the notification out of the deploy's critical path — a Telegram outage
# cannot fail a deploy — and means a new workflow only has to be named here.
#
# Both `in_progress` and `completed` are reported: one message when a run picks
# up so a deploy can be watched while it happens, and one with the result.

on:
  workflow_run:
    workflows:
      - Quality
      - Edge and docs quality
      - Deploy production
      - Deploy marketing site and docs
      - Deploy tenant router
      - Deploy embeds to R2
    types:
      - in_progress
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  # Keyed by action as well as run: the start and the result are two messages
  # about the same run, and one must not cancel the other.
  group: notify-ci-cd-${{ github.event.workflow_run.id }}-${{ github.event.action }}
  cancel-in-progress: false

jobs:
  notify:
    name: Send Telegram notification
    # On GitHub's runners, not the production machine: sending a message needs
    # nothing local, and the point of this pipeline is to keep work off that box.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main') ||
      github.event_name == 'workflow_dispatch'
    steps:
      # The composite action lives in this repository, so it has to be on disk
      # before it can be used.
      - uses: actions/checkout@v4

      - name: Describe the run
        id: run
        env:
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          EVENT_ACTION: ${{ github.event.action }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_STARTED_AT: ${{ github.event.workflow_run.run_started_at }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
        run: |
          set -euo pipefail

          if [ "${IS_MANUAL}" = "true" ]; then
            {
              echo "title=ClassroomHub — notification test"
              echo "status=success"
              echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "commit_title=Manual notification smoke test"
              echo "commit_author=${GITHUB_ACTOR}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only the first line is the subject; the body is deliberately dropped
          # so a long commit message cannot push the links out of the preview.
          subject="$(printf '%s' "${COMMIT_MESSAGE}" | head -n 1)"

          # A run that has just picked up has no conclusion yet; saying "started"
          # is what makes the first message readable instead of an empty status.
          if [ "${EVENT_ACTION}" = "in_progress" ]; then
            status="started"
          else
            status="${CONCLUSION}"
          fi

          {
            echo "title=ClassroomHub — ${WORKFLOW_NAME}"
            echo "status=${status}"
            echo "started_at=${RUN_STARTED_AT}"
            echo "commit_title=${subject}"
            echo "commit_author=${COMMIT_AUTHOR}"
          } >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        uses: ./.github/actions/telegram-notify
        with:
          telegram_bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          title: ${{ steps.run.outputs.title }}
          status: ${{ steps.run.outputs.status }}
          branch: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.workflow_run.head_branch }}
          actor: ${{ github.event_name == 'workflow_dispatch' && github.actor || github.event.workflow_run.actor.login }}
          repo: ${{ github.repository }}
          run_id: ${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.workflow_run.id }}
          commit: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          repo_url: ${{ github.server_url }}/${{ github.repository }}
          run_url: ${{ github.event_name == 'workflow_dispatch' && format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) || github.event.workflow_run.html_url }}
          commit_url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          commit_title: ${{ steps.run.outputs.commit_title }}
          commit_author: ${{ steps.run.outputs.commit_author }}
          started_at: ${{ steps.run.outputs.started_at }}
