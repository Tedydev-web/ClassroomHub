name: Quality

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/jobs/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.nvmrc'
      - 'apps/docs/.nvmrc'
      - '.github/workflows/quality.yml'
      - '.github/workflows/edge-quality.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/notify-ci-cd.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/jobs/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.nvmrc'
      - 'apps/docs/.nvmrc'
      - '.github/workflows/quality.yml'
      - '.github/workflows/edge-quality.yml'
      - '.github/workflows/deploy-production.yml'
      - '.github/workflows/notify-ci-cd.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation, ci]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate secret-free build environment
        run: pnpm setup:env

      - name: Check repository formatting
        run: pnpm format:all:check

      # These are the exact package builds previously duplicated by the
      # separate Package build check. Keeping them here retains the gate while
      # avoiding a second runner queue and dependency installation.
      - name: Build API packages
        run: pnpm --filter @cio/api^... build && pnpm --filter @cio/api build

      - name: Build dashboard packages
        run: pnpm --filter @cio/dashboard^... build && pnpm --filter @cio/dashboard build

      - name: Run focused unit suites
        run: |
          pnpm --filter @cio/question-types test
          pnpm --filter @cio/exam-import test
          pnpm --filter @cio/exam-import test:corpus
          pnpm --filter @cio/utils test
          pnpm --filter @cio/jobs test
          pnpm --filter @cio/jobs-worker test
          pnpm --filter @cio/api test
          pnpm --filter @cio/dashboard test

      - name: Lint application code
        run: |
          pnpm --filter @cio/api lint
          pnpm --filter @cio/dashboard lint

  selective-assignment-integration:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation, ci]
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/classroomhub
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate secret-free build environment
        run: pnpm setup:env

      - name: Start ephemeral PostgreSQL
        env:
          CI_POSTGRES_CONTAINER: classroomhub-ci-postgres-${{ github.run_id }}
        run: |
          set -euo pipefail
          runner_container=$(docker ps \
            --filter "id=$(hostname)" \
            --format '{{.Names}}' \
            | head -n 1)
          test -n "$runner_container"

          docker run --detach --rm \
            --name "$CI_POSTGRES_CONTAINER" \
            --network "container:${runner_container}" \
            --env POSTGRES_DB=classroomhub \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=postgres \
            postgres:16-alpine

          for attempt in $(seq 1 30); do
            if docker exec "$CI_POSTGRES_CONTAINER" pg_isready -U postgres -d classroomhub >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done

          docker logs "$CI_POSTGRES_CONTAINER" >&2
          exit 1

      - name: Build API dependency graph
        run: pnpm turbo run build --filter=@cio/api...

      - name: Apply database migrations
        run: pnpm --filter @cio/db db:migrate

      - name: Finalize assessment schema
        run: pnpm --filter @cio/db db:finalize-assessment-schema

      - name: Verify selective assignment contracts
        run: pnpm --filter @cio/db exec tsx scripts/selective-exercise-assignment.integration.check.ts

      - name: Verify archive aggregate contracts
        run: pnpm --filter @cio/db exec tsx scripts/archive-aggregates.integration.check.ts

      - name: Verify question revision gateway contract
        run: pnpm --filter @cio/core exec tsx src/services/assessment/question-revision.integration.check.ts

      - name: Run guarded database integration suites
        env:
          RUN_DB_INTEGRATION: '1'
        run: >-
          pnpm --filter @cio/api exec vitest run --testTimeout 120000
          src/services/exercise/question-revision-db.integration.test.ts
          src/services/submission/submission-db.integration.test.ts
          src/services/exam-import/exam-import-db.integration.test.ts

      - name: Rehearse assessment migration chain
        run: pnpm --filter @cio/db db:rehearse-assessment-migration

      - name: Stop ephemeral PostgreSQL
        if: always()
        env:
          CI_POSTGRES_CONTAINER: classroomhub-ci-postgres-${{ github.run_id }}
        run: docker rm --force "$CI_POSTGRES_CONTAINER" >/dev/null 2>&1 || true
