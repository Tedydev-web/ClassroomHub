name: Quality

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/jobs/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/quality.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'apps/dashboard/**'
      - 'apps/jobs/**'
      - 'packages/**'
      - 'docker/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'turbo.json'
      - '.nvmrc'
      - '.github/workflows/quality.yml'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-unit:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation]
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate secret-free build environment
        run: pnpm setup:env

      - name: Check repository formatting
        run: pnpm format:all:check

      - name: Build API dependency graph
        run: pnpm turbo run build --filter=@cio/api...

      - name: Build dashboard dependency graph
        run: pnpm turbo run build --filter=@cio/dashboard...

      - name: Run focused unit suites
        run: |
          pnpm --filter @cio/question-types test
          pnpm --filter @cio/exam-import test
          pnpm --filter @cio/exam-import test:corpus
          pnpm --filter @cio/utils test
          pnpm --filter @cio/jobs test
          pnpm --filter @cio/jobs-worker test
          pnpm --filter @cio/api test
          pnpm --filter @cio/dashboard test

      - name: Lint application code
        run: |
          pnpm --filter @cio/api lint
          pnpm --filter @cio/dashboard lint

  selective-assignment-integration:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, workstation]
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classroomhub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d classroomhub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/classroomhub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate secret-free build environment
        run: pnpm setup:env

      - name: Build API dependency graph
        run: pnpm turbo run build --filter=@cio/api...

      - name: Apply database migrations
        run: pnpm --filter @cio/db db:migrate

      - name: Finalize assessment schema
        run: pnpm --filter @cio/db db:finalize-assessment-schema

      - name: Verify selective assignment contracts
        run: pnpm --filter @cio/db exec tsx scripts/selective-exercise-assignment.integration.check.ts

      - name: Verify archive aggregate contracts
        run: pnpm --filter @cio/db exec tsx scripts/archive-aggregates.integration.check.ts

      - name: Verify question revision gateway contract
        run: pnpm --filter @cio/core exec tsx src/services/assessment/question-revision.integration.check.ts

      - name: Run guarded database integration suites
        env:
          RUN_DB_INTEGRATION: '1'
        run: >-
          pnpm --filter @cio/api exec vitest run --testTimeout 120000
          src/services/exercise/question-revision-db.integration.test.ts
          src/services/submission/submission-db.integration.test.ts
          src/services/exam-import/exam-import-db.integration.test.ts

      - name: Rehearse assessment migration chain
        run: pnpm --filter @cio/db db:rehearse-assessment-migration
