name: Deploy marketing site and help

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/help/**'
      - 'apps/website/**'
      # The site bundles these workspace packages, so a change to one of them
      # changes what is served. Without them a fix in packages/ui landed on main
      # and never redeployed: the marketing site stayed on its last successful
      # build while main had moved on.
      - 'packages/ui/**'
      - 'packages/utils/**'
      - 'packages/certificates/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_call:
  workflow_dispatch:
    inputs:
      runner_pool:
        description: Runner pool (self-hosted uses no GitHub minutes; github-hosted needs working Actions billing)
        type: choice
        options:
          - self-hosted
          - github-hosted
        default: self-hosted

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_pool == 'github-hosted') && 'ubuntu-latest' || fromJson('["self-hosted", "Linux", "deploy"]') }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Blume requires Node >= 22.12; the rest of the monorepo is still on 20.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: 'apps/docs/.nvmrc'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@cio/help^...

      # The documentation itself is retired; what deploys here is the 410 handler
      # that stands where it was, so there is nothing to build or link-check.
      - name: Deploy the retired docs placeholder to Cloudflare
        run: pnpm --filter @cio/docs exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # The Help Center is its own worker, proxied at /help by the marketing
      # site. Nothing deployed it until now, which is why that path 404s.
      - name: Validate Help Center links and anchors
        run: pnpm --filter @cio/help validate

      - name: Build Help Center
        run: pnpm --filter @cio/help build

      - name: Deploy Help Center to Cloudflare
        run: pnpm --filter @cio/help exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  website:
    needs: deploy
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.runner_pool == 'github-hosted') && 'ubuntu-latest' || fromJson('["self-hosted", "Linux", "deploy"]') }}
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Cloudflare's workerd binary needs newer glibc than the runner host
      # provides. Pin the full toolchain to Debian Bookworm so build and deploy
      # do not depend on the host operating system.
      #
      # How the workspace reaches the build container depends on where the job runs.
      # On a GitHub-hosted runner the Docker daemon is the same machine, so the
      # workspace path bind-mounts directly. The self-hosted runners are themselves
      # containers talking to the host's daemon: their workspace path does not exist
      # on the host, a bind mount comes up empty (`No package.json found`), and the
      # workspace has to be shared with `--volumes-from` the runner container, whose
      # id is $HOSTNAME. Probing for that container picks the right form, instead of
      # hard-coding one and breaking whenever the job changes runner pools.
      - name: Build and deploy website in compatible container
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          dependency_volume="classroomhub-ci-deps-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker volume create "$dependency_volume" >/dev/null
          trap 'docker volume rm "$dependency_volume" >/dev/null 2>&1 || true' EXIT
          if docker container inspect "$HOSTNAME" >/dev/null 2>&1; then
            workspace_mount=(--volumes-from "$HOSTNAME")
          else
            workspace_mount=(--volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE")
          fi
          docker run --rm \
            --user 0:0 \
            --env HOME=/tmp \
            --env CI=true \
            --env NODE_OPTIONS=--max-old-space-size=12288 \
            --env R2_ACCOUNT_ID \
            --env R2_ACCESS_KEY \
            --env R2_SECRET_ACCESS_KEY \
            --env CLOUDFLARE_ACCOUNT_ID \
            --env CLOUDFLARE_API_TOKEN \
            "${workspace_mount[@]}" \
            --volume "$dependency_volume:$GITHUB_WORKSPACE/node_modules" \
            --workdir "$GITHUB_WORKSPACE" \
            node:22-bookworm-slim \
            bash -euc '
              mkdir -p /tmp/bin
              corepack prepare pnpm@10.19.0 --activate
              corepack enable --install-directory /tmp/bin
              export PATH=/tmp/bin:$PATH
              pnpm --version
              pnpm install --frozen-lockfile
              pnpm --filter @cio/embeds exec tsx scripts/upload-marketing-video.ts
              pnpm turbo run build --filter=@cio/website^...
              pnpm --filter @cio/website check
              pnpm --filter @cio/website build
              pnpm --filter @cio/website exec wrangler deploy
            '
