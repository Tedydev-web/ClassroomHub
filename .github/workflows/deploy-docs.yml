name: Deploy marketing site and docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/website/**'
      - 'packages/utils/src/openapi/**'
      - '.github/workflows/deploy-docs.yml'
  # Called by upload-openapi-spec.yml: the API reference is rendered statically
  # at build time, so a new spec in R2 only reaches the site via a docs rebuild.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, workstation]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Blume requires Node >= 22.12; the rest of the monorepo is still on 20.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: 'apps/docs/.nvmrc'
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # scripts/fetch-openapi.mjs imports @cio/utils/openapi/public-api from dist.
      - name: Build workspace dependencies
        run: pnpm turbo run build --filter=@cio/docs^...

      # Blume reports every public asset under /docs as a base-path warning, but
      # exits non-zero for broken pages and anchors. Keep that failure fatal.
      - name: Validate links and anchors
        run: pnpm --filter @cio/docs validate

      - name: Build docs
        run: pnpm --filter @cio/docs build

      - name: Deploy to Cloudflare
        run: pnpm --filter @cio/docs exec wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  website:
    needs: deploy
    runs-on: [self-hosted, Linux, workstation]
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      # Cloudflare's workerd binary needs newer glibc than the runner host
      # provides. Pin the full toolchain to Debian Bookworm so build and deploy
      # do not depend on the host operating system.
      - name: Build and deploy website in compatible container
        env:
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.CLOUDFLARE_ACCESS_KEY }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --env CI=true \
            --env NODE_OPTIONS=--max-old-space-size=12288 \
            --env R2_ACCOUNT_ID \
            --env R2_ACCESS_KEY \
            --env R2_SECRET_ACCESS_KEY \
            --env CLOUDFLARE_ACCOUNT_ID \
            --env CLOUDFLARE_API_TOKEN \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            node:22-bookworm-slim \
            bash -euc '
              mkdir -p /tmp/bin
              corepack prepare pnpm@10.19.0 --activate
              corepack enable --install-directory /tmp/bin
              export PATH=/tmp/bin:$PATH
              pnpm --version
              pnpm install --frozen-lockfile
              pnpm --filter @cio/embeds exec tsx scripts/upload-marketing-video.ts
              pnpm turbo run build --filter=@cio/website^...
              pnpm --filter @cio/website check
              pnpm --filter @cio/website build
              pnpm --filter @cio/website exec wrangler deploy
            '
