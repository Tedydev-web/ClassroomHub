name: Upstream sync proposal

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: [self-hosted, Linux, workstation]
    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fetch upstream main
        run: |
          git remote get-url upstream >/dev/null 2>&1 || \
            git remote add upstream https://github.com/classroomhub/classroomhub.git
          git fetch --no-tags upstream main

      - name: Prepare sync branch
        id: sync
        env:
          BRANCH: automation/upstream-sync
        run: |
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH:refs/remotes/origin/$BRANCH" || true
          git switch --force-create "$BRANCH" origin/main

          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "Upstream merge has conflicts. Resolve them on a local integration branch."
            exit 1
          fi

          git push --force-with-lease origin "HEAD:$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update sync pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view automation/upstream-sync --json number >/dev/null 2>&1; then
            gh pr edit automation/upstream-sync \
              --title "chore: sync upstream main" \
              --body "Automated proposal to merge the latest upstream/main into this fork. Review conflicts and required checks before merging."
          else
            gh pr create \
              --base main \
              --head automation/upstream-sync \
              --title "chore: sync upstream main" \
              --body "Automated proposal to merge the latest upstream/main into this fork. Review conflicts and required checks before merging."
          fi
