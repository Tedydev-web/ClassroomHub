name: Deploy tenant router

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/tenant-router/**"
      - ".github/workflows/deploy-tenant-router.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: tenant-router-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck tenant router
        run: pnpm --filter @cio/tenant-router typecheck

      - name: Deploy tenant router
        run: pnpm --filter @cio/tenant-router exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
