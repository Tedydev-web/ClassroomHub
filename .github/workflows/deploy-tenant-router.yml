name: Deploy tenant router

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/tenant-router/**"
      - ".github/workflows/deploy-tenant-router.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: deploy-tenant-router
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck tenant router
        run: pnpm --filter @cio/tenant-router typecheck

      - name: Deploy tenant router
        run: pnpm --filter @cio/tenant-router exec wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
