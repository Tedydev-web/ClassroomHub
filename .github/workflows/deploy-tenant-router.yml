name: Deploy tenant router

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/tenant-router/**"
      - ".github/workflows/deploy-tenant-router.yml"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: tenant-router-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, workstation]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck tenant router
        run: pnpm --filter @cio/tenant-router typecheck

      - name: Deploy tenant router
        run: pnpm --filter @cio/tenant-router deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
