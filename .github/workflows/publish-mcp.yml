name: Publish @tedydev/classroom-mcp to NPM

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/mcp/**"

concurrency:
  group: publish-mcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: [self-hosted, Linux, deploy]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build MCP workspace dependencies
        run: pnpm turbo run build --filter=@tedydev/classroom-mcp^...

      - name: Build publishable MCP package
        run: pnpm mcp:build

      - name: Publish package
        if: github.event_name == 'workflow_dispatch'
        run: pnpm --filter @tedydev/classroom-mcp publish --no-git-checks --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
