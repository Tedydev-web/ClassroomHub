name: Deploy production

# Deploys only after the Quality-gated OCI release has completed on main. A
# plain `push` trigger could deploy source that never passed validation.
on:
  workflow_run:
    workflows: ['Release production images']
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  # Image publication is serialized separately. This lock protects the single
  # production rollout and its database migration.
  group: classroomhub-host-heavy-main
  cancel-in-progress: false

jobs:
  deploy:
    # `workflow_run` fires on failure too, so the conclusion has to be checked.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    # Deployed via the self-hosted runner to keep hosted minutes at 0 for deployments.
    # Polling remains in-band to keep post-deploy status deterministic.
    runs-on: [self-hosted, Linux, deploy]
    timeout-minutes: 45

    steps:
      - name: Resolve release commit
        id: release
        env:
          RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          test "${#RELEASE_SHA}" -eq 40
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      # A successful Quality run must not be reported as a successful release
      # when the production deploy contract is incomplete.
      - name: Check deploy credentials
        id: creds
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          missing=0
          for variable_name in COOLIFY_URL COOLIFY_TOKEN COOLIFY_APP_UUID CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            if [ -z "${!variable_name}" ]; then
              echo "::error::Missing required production deploy secret: ${variable_name}"
              missing=1
            fi
          done
          test "$missing" -eq 0
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Verify merged pull-request provenance
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          merged_pr_count=$(gh api \
            "repos/${REPOSITORY}/commits/${RELEASE_SHA}/pulls" \
            | jq --arg release_sha "$RELEASE_SHA" \
                '[.[] | select(.base.ref == "main" and .merged_at != null and .merge_commit_sha == $release_sha)] | length')

          if [ "$merged_pr_count" -ne 1 ]; then
            echo "::error::Release ${RELEASE_SHA} is not the merge commit of exactly one merged pull request into main."
            exit 1
          fi

          echo "Verified merged pull-request provenance for ${RELEASE_SHA}."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable release images
        id: images
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          resolve_image() {
            local image_name="$1"
            local digest
            digest=$(docker buildx imagetools inspect "ghcr.io/tedydev-web/${image_name}:sha-${RELEASE_SHA}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            test "${digest#sha256:}" != "$digest"
            printf 'ghcr.io/tedydev-web/%s@%s' "${image_name}" "${digest}"
          }

          api_image=$(resolve_image classroom-api)
          dashboard_image=$(resolve_image classroom-dashboard)
          jobs_image=$(resolve_image classroom-jobs)

          printf 'api_image=%s\n' "$api_image" >> "$GITHUB_OUTPUT"
          printf 'dashboard_image=%s\n' "$dashboard_image" >> "$GITHUB_OUTPUT"
          printf 'jobs_image=%s\n' "$jobs_image" >> "$GITHUB_OUTPUT"

      - name: Reconcile production image references
        if: steps.creds.outputs.ready == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          API_IMAGE: ${{ steps.images.outputs.api_image }}
          DASHBOARD_IMAGE: ${{ steps.images.outputs.dashboard_image }}
          JOBS_IMAGE: ${{ steps.images.outputs.jobs_image }}
        run: |
          set -euo pipefail

          coolify_url=$(printf '%s' "${COOLIFY_URL}" | tr -d '[:space:]')
          app_uuid=$(printf '%s' "${COOLIFY_APP_UUID}" | tr -d '[:space:]')
          token=$(printf '%s' "${COOLIFY_TOKEN}" | tr -d '[:space:]')
          cf_id=$(printf '%s' "${CF_ACCESS_CLIENT_ID}" | tr -d '[:space:]')
          cf_secret=$(printf '%s' "${CF_ACCESS_CLIENT_SECRET}" | tr -d '[:space:]')

          response=$(curl -sS --max-time 30 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "CF-Access-Client-Id: ${cf_id}" \
            -H "CF-Access-Client-Secret: ${cf_secret}" \
            "${coolify_url}/api/v1/applications/${app_uuid}/envs")
          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')
          test "$status" = "200"

          reconcile_image() {
            local key="$1"
            local expected="$2"
            local current
            local payload
            local method
            local update_response
            local update_status

            current=$(printf '%s' "$body" | jq -r --arg key "$key" '.. | objects | select(.key? == $key) | .value' | head -n1)
            if [ "$current" = "$expected" ]; then
              echo "${key} already matches the release digest"
              return
            fi

            payload=$(jq -cn --arg key "$key" --arg value "$expected" '{key: $key, value: $value, is_literal: true, is_multiline: false, is_preview: false}')
            method=POST
            if [ -n "$current" ]; then
              method=PATCH
            fi

            update_response=$(curl -sS --max-time 30 -w '\n%{http_code}' -X "$method" \
              -H "Authorization: Bearer ${token}" \
              -H "CF-Access-Client-Id: ${cf_id}" \
              -H "CF-Access-Client-Secret: ${cf_secret}" \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              "${coolify_url}/api/v1/applications/${app_uuid}/envs")
            update_status=$(printf '%s' "$update_response" | tail -n1)
            case "$update_status" in
              200|201) echo "${key} reconciled to the release digest" ;;
              *) echo "::error::Coolify rejected ${key} reconciliation with HTTP ${update_status}" >&2; exit 1 ;;
            esac
          }

          reconcile_image API_IMAGE "$API_IMAGE"
          reconcile_image DASHBOARD_IMAGE "$DASHBOARD_IMAGE"
          reconcile_image JOBS_IMAGE "$JOBS_IMAGE"

      - name: Trigger Coolify deployment
        id: trigger
        if: steps.creds.outputs.ready == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          # The dashboard sits behind Cloudflare Access, so a browser login
          # redirect is what an unauthenticated caller gets. Access issues
          # service tokens for exactly this case.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          # A secret stored with a trailing newline puts that newline inside the
          # header value, which terminates the header line with a bare LF instead
          # of CRLF and gets the request rejected at the edge before it reaches
          # Coolify. None of these values contain whitespace, so stripping it is
          # safe and makes the job independent of how the secret was entered.
          coolify_url=$(printf '%s' "${COOLIFY_URL}" | tr -d '[:space:]')
          app_uuid=$(printf '%s' "${COOLIFY_APP_UUID}" | tr -d '[:space:]')
          token=$(printf '%s' "${COOLIFY_TOKEN}" | tr -d '[:space:]')
          cf_id=$(printf '%s' "${CF_ACCESS_CLIENT_ID}" | tr -d '[:space:]')
          cf_secret=$(printf '%s' "${CF_ACCESS_CLIENT_SECRET}" | tr -d '[:space:]')

          # Capture the status separately: on a failure the body is the only
          # thing that says whether the refusal came from Cloudflare Access or
          # from Coolify, and command substitution would otherwise discard it.
          response=$(curl -sS --max-time 60 -w '\n%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            -H "CF-Access-Client-Id: ${cf_id}" \
            -H "CF-Access-Client-Secret: ${cf_secret}" \
            "${coolify_url}/api/v1/deploy?uuid=${app_uuid}&force=false")

          status=$(printf '%s' "$response" | tail -n1)
          body=$(printf '%s' "$response" | sed '$d')

          if [ "$status" != "200" ]; then
            echo "Coolify deploy request failed with HTTP ${status}:" >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi

          uuid=$(printf '%s' "$body" | jq -r '.deployments[0].deployment_uuid // empty')
          if [ -z "$uuid" ]; then
            echo "Coolify accepted the request but returned no deployment uuid:" >&2
            printf '%s\n' "$body" >&2
            exit 1
          fi

          echo "deployment_uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "Queued deployment $uuid"

      - name: Wait for the deployment to settle
        if: steps.creds.outputs.ready == 'true'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          # Polling rather than a webhook: Coolify has no callback, and the job
          # has to fail loudly when a build breaks instead of reporting success
          # for a deployment that never came up.
          coolify_url=$(printf '%s' "${COOLIFY_URL}" | tr -d '[:space:]')
          token=$(printf '%s' "${COOLIFY_TOKEN}" | tr -d '[:space:]')
          cf_id=$(printf '%s' "${CF_ACCESS_CLIENT_ID}" | tr -d '[:space:]')
          cf_secret=$(printf '%s' "${CF_ACCESS_CLIENT_SECRET}" | tr -d '[:space:]')

          deadline=$(( SECONDS + 2400 ))
          last=""

          while [ "$SECONDS" -lt "$deadline" ]; do
            response=$(curl -sS --max-time 30 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${token}" \
              -H "CF-Access-Client-Id: ${cf_id}" \
              -H "CF-Access-Client-Secret: ${cf_secret}" \
              "${coolify_url}/api/v1/deployments/${DEPLOYMENT_UUID}" || true)

            http_status=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            status=$(printf '%s' "$body" | jq -er '.status | strings' 2>/dev/null || true)

            # Coolify is reached through Cloudflare Access. A transient edge
            # HTML/error response is not a deployment result and must not turn
            # a completed deployment into a false CI failure.
            if [ "$http_status" != "200" ] || [ -z "$status" ]; then
              echo "$(date -u +%H:%M:%S) poll unavailable; retrying"
              sleep 20
              continue
            fi

            if [ "$status" != "$last" ]; then
              echo "$(date -u +%H:%M:%S) $status"
              last="$status"
            fi

            case "$status" in
              finished) echo "Deployment finished."; exit 0 ;;
              failed)   echo "Deployment failed — see the Coolify deployment log." >&2; exit 1 ;;
            esac

            sleep 20
          done

          echo "Timed out waiting for deployment ${DEPLOYMENT_UUID}." >&2
          exit 1
