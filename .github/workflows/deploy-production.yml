name: Deploy production

# Images are built on GitHub's runners and pulled by the production host, which
# does no building at all.
#
# The host used to build from its own checkout, and Coolify hardcodes
# `docker compose build --pull --no-cache` for compose deployments — it ignores
# the application's own "disable build cache" setting. Every push therefore
# rebuilt four images from zero on the machine that also serves the site: about
# twenty minutes, of which roughly nine were a hard outage, because Coolify
# removes the running containers before the new ones exist.
#
# Splitting the work fixes both halves. The build moves off the production
# machine entirely, and it regains a layer cache (a registry cache, so it
# survives between runs). What Coolify does on the host shrinks to `up`.
#
# GitHub cannot reach Coolify directly: Cloudflare Access sits in front of the
# public hostname and answers an unauthenticated request with a sign-in page,
# recording HTTP 200 while Coolify never hears about it. The deploy job runs on
# the runner that lives on the Coolify host and reaches the API over the Docker
# bridge instead, from inside the Access perimeter.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  # Never cancel a deployment midway: Coolify removes the running containers
  # before it creates the new ones, so an interrupted deploy leaves the site
  # down with nothing to roll back to.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tedydev-web

jobs:
  images:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            dockerfile: ./docker/Dockerfile.api
            image: classroom-api
            build_args: ''
          - name: dashboard
            dockerfile: ./docker/Dockerfile.dashboard
            image: classroom-dashboard
            build_args: |
              PUBLIC_IS_SELFHOSTED=false
              PUBLIC_IS_SELF_OWNED=true
          - name: jobs
            dockerfile: ./docker/Dockerfile.jobs
            image: classroom-jobs
            build_args: ''
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.build_args }}
          push: true
          # The commit tag is what the deploy pulls; `latest` is only a
          # convenience for a human reading the registry.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false

  deploy:
    name: Deploy to Coolify
    needs: images
    runs-on: [self-hosted, Linux, deploy]
    timeout-minutes: 30
    steps:
      - name: Pull the images onto the production host
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The packages are private, and Coolify's own client has no registry
          # credentials. Pulling here — as the runner, which does — puts the
          # images in the host's local store, so `docker compose up` finds them
          # without Coolify ever needing to authenticate.
          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

          for image in classroom-api classroom-dashboard classroom-jobs; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${image}:sha-${GITHUB_SHA}"
            echo "Pulling ${ref}"
            docker pull --quiet "${ref}"
          done

          docker logout "${REGISTRY}"

      - name: Point the stack at this commit
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: http://172.17.0.1:18080
          APP_UUID: zj19oe40izga1bnpymfz5z55
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is missing"
            exit 1
          fi

          # The compose file reads CLASSROOM_IMAGE_TAG, so the deployed commit is
          # explicit rather than whatever `latest` happened to point at.
          # PATCH upserts by key, so this works whether or not the variable exists.
          body="$(mktemp)"
          trap 'rm -f "${body}"' EXIT

          code="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 60 -X PATCH \
            "${COOLIFY_URL}/api/v1/applications/${APP_UUID}/envs" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "{\"key\":\"CLASSROOM_IMAGE_TAG\",\"value\":\"sha-${GITHUB_SHA}\",\"is_preview\":false}")"

          case "${code}" in
            200|201) echo "CLASSROOM_IMAGE_TAG set to sha-${GITHUB_SHA}." ;;
            *) echo "::error::Coolify refused the environment update (HTTP ${code})"; cat "${body}"; exit 1 ;;
          esac

      - name: Trigger and wait
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: http://172.17.0.1:18080
          APP_UUID: zj19oe40izga1bnpymfz5z55
          POLL_SECONDS: 15
          MAX_POLLS: 100
        run: |
          set -euo pipefail

          body="$(mktemp)"
          trap 'rm -f "${body}"' EXIT

          code="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 60 \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${APP_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")"

          if [ "${code}" != "200" ]; then
            echo "::error::Coolify refused the deploy request (HTTP ${code})"
            cat "${body}"
            exit 1
          fi

          uuid="$(jq -r '.deployments[0].deployment_uuid // empty' "${body}")"
          if [ -z "${uuid}" ]; then
            echo "::error::Coolify accepted the request but queued no deployment"
            cat "${body}"
            exit 1
          fi

          echo "Queued deployment ${uuid} for ${GITHUB_SHA}."

          previous=""
          for _ in $(seq 1 "${MAX_POLLS}"); do
            sleep "${POLL_SECONDS}"

            # A single failed poll is not a failed deploy; keep waiting.
            if ! curl -sS -o "${body}" --max-time 30 \
              "${COOLIFY_URL}/api/v1/deployments/${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"; then
              echo "Status request failed, retrying."
              continue
            fi

            status="$(jq -r '.status // empty' "${body}")"
            [ -z "${status}" ] && { echo "No status in response, retrying."; continue; }

            if [ "${status}" != "${previous}" ]; then
              echo "Deployment ${uuid}: ${status}"
              previous="${status}"
            fi

            case "${status}" in
              finished)
                echo "Deployment ${uuid} finished."
                exit 0
                ;;
              failed|error|cancelled-by-user)
                echo "::error::Deployment ${uuid} ended as ${status}. Open it in Coolify for the build log."
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment ${uuid} did not finish within the polling budget; it may still be running in Coolify."
          exit 1
