name: Deploy production

# Push to main, and this machine is running the new code a few minutes later.
#
# Two jobs. GitHub's runners produce the images; the runner on the production
# host pulls them and starts the stack with plain Compose. Nothing is built
# here and Coolify is not in the path — it stayed in it long enough to teach us
# why it should not be: it hardcodes `build --pull --no-cache` for compose
# deployments, so every push rebuilt four images from zero on the machine that
# also serves the site, and it removes the running containers *before* the new
# ones exist. A failed build therefore left the site down with nothing to fall
# back to, which is exactly what happened three times in one morning.
#
# There is no separate lint or test gate. The image build runs `tsc` for the API
# and `vite build` for the dashboard, so a syntax error, a type error or an
# unresolved import fails the build and never reaches this host. That is the
# check worth having in the deploy path; the rest belongs in review.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_all:
        description: Rebuild every service, whatever the host is already serving
        type: boolean
        default: false

concurrency:
  group: deploy-production
  # Never cancel a deploy midway: `up -d` is quick, but interrupting it between
  # `docker pull` and the restart would leave a half-updated stack.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: tedydev-web
  # Written once from Coolify and owned by the host. Secrets stay on this
  # machine instead of moving into GitHub.
  HOST_ENV_DIR: /home/tedydev/.config/classroomhub

jobs:
  # What each service is actually serving right now.
  #
  # The narrowing below used to diff `github.event.before` against this commit, which is only
  # the right range when the previous deploy succeeded. When one fails, its services keep
  # serving an older image, and the next push — touching only some other service — leaves
  # them there. That is exactly what happened on the upstream sync: a failed jobs build left
  # the API and dashboard three commits behind while every run reported success.
  #
  # Asking the host what it is running makes the range true by construction.
  running:
    name: What is running
    runs-on: [self-hosted, Linux, deploy]
    timeout-minutes: 5
    outputs:
      api: ${{ steps.read.outputs.api }}
      dashboard: ${{ steps.read.outputs.dashboard }}
      jobs: ${{ steps.read.outputs.jobs }}
    steps:
      - id: read
        run: |
          set -euo pipefail

          for service in api dashboard jobs; do
            container="zj19oe40izga1bnpymfz5z55-${service}-1"
            image="$(docker inspect --format '{{.Config.Image}}' "${container}" 2>/dev/null || true)"
            sha="${image##*:sha-}"

            # An unreadable container, a tag that is not a sha, or no container at all: say
            # nothing and let the decider rebuild that service rather than guess.
            case "${sha}" in
              [0-9a-f]*) : ;;
              *) sha="" ;;
            esac

            echo "${service}=${sha}" >> "${GITHUB_OUTPUT}"
            echo "${service} is serving ${sha:-<unknown>}"
          done

  # Which services are behind this commit.
  #
  # Everything used to be rebuilt and restarted on every commit, because the compose file
  # gave all three one shared image tag. A change to the teacher's screen therefore restarted
  # the API in the middle of an exam — the process a candidate's autosaves, activity reports
  # and submission all go through — and paid twelve minutes to do it.
  #
  # The rule lives in a script with tests rather than in a `paths:` filter here, because
  # being wrong in the narrowing direction ships a dashboard against an API that does not
  # have the endpoint it calls.
  changes:
    name: Decide what to build
    needs: running
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.decide.outputs.services }}
      matrix: ${{ steps.decide.outputs.matrix }}
      any: ${{ steps.decide.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both ends of the range have to be present to diff them.
          fetch-depth: 0

      - id: decide
        env:
          RUNNING_API: ${{ needs.running.outputs.api }}
          RUNNING_DASHBOARD: ${{ needs.running.outputs.dashboard }}
          RUNNING_JOBS: ${{ needs.running.outputs.jobs }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
        run: |
          set -euo pipefail

          # The rule decides what gets rebuilt and what keeps serving, so it is checked
          # before it is trusted. Two seconds, and it catches the narrowing that would ship
          # a dashboard against an API that does not have the endpoint it calls.
          node --test scripts/changed-deploy-services.test.mjs

          # One range per service: from the commit it is serving to this one. A service
          # already on this commit has an empty range and is left alone; one left behind by a
          # failed deploy has a range that still contains its own changes, so it is rebuilt.
          services=""

          if [ "${REBUILD_ALL}" = "true" ]; then
            echo "Manual rebuild requested: building everything."
            services="api dashboard jobs"
          fi

          for service in api dashboard jobs; do
            # `if`, not `[ ... ] && continue`: under `set -e` the latter exits the script on
            # the ordinary path, where the test is false.
            if [ "${REBUILD_ALL}" = "true" ]; then continue; fi

            case "${service}" in
              api) running="${RUNNING_API}" ;;
              dashboard) running="${RUNNING_DASHBOARD}" ;;
              jobs) running="${RUNNING_JOBS}" ;;
            esac

            # Nothing known, or a commit this clone does not have (a force-push, a rebuilt
            # host): rebuild. Being wrong in the narrowing direction ships a dashboard against
            # an API that does not have the endpoint it calls.
            if [ -z "${running}" ] || ! git cat-file -e "${running}^{commit}" 2>/dev/null; then
              services="${services} ${service}"
              echo "${service}: serving an unknown commit, rebuilding"
              continue
            fi

            if [ "${running}" = "${GITHUB_SHA}" ]; then
              echo "${service}: already on this commit"
              continue
            fi

            files="$(git diff --name-only "${running}" "${GITHUB_SHA}")"

            if [ -z "${files}" ]; then
              echo "${service}: no file changed since ${running}"
              continue
            fi

            # `-d '\n'` so a path with a space is one argument, and `sort -u` because xargs
            # may split a long list across several runs, each answering for its own share.
            touched="$(printf '%s\n' "${files}" | xargs -d '\n' node scripts/changed-deploy-services.mjs | sort -u | tr '\n' ' ')"

            case " ${touched} " in
              *" ${service} "*)
                services="${services} ${service}"
                echo "${service}: changed since ${running}"
                ;;
              *) echo "${service}: unaffected by changes since ${running}" ;;
            esac
          done

          services="$(echo "${services}" | xargs || true)"
          echo "Services to build: ${services:-<none>}"
          echo "services=${services}" >> "${GITHUB_OUTPUT}"
          echo "any=$([ -n "${services}" ] && echo true || echo false)" >> "${GITHUB_OUTPUT}"

          matrix="$(node -e '
            const wanted = new Set(process.argv[1].split(" ").filter(Boolean));
            // Dashboard first: it is the longest build by two minutes, so whichever
            // runner frees up first should take it. Runners are handed jobs in matrix
            // order, and when this list started with api the dashboard waited behind
            // two shorter builds and set the critical path on its own.
            const all = [
              {
                name: "dashboard",
                dockerfile: "./docker/Dockerfile.dashboard",
                image: "classroom-dashboard",
                build_args: "PUBLIC_IS_SELFHOSTED=false\nPUBLIC_IS_SELF_OWNED=true"
              },
              { name: "api", dockerfile: "./docker/Dockerfile.api", image: "classroom-api", build_args: "" },
              { name: "jobs", dockerfile: "./docker/Dockerfile.jobs", image: "classroom-jobs", build_args: "" }
            ];
            console.log(JSON.stringify({ include: all.filter((entry) => wanted.has(entry.name)) }));
          ' "${services}")"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  # Built on the machine that runs them.
  #
  # GitHub's runners built these for months, and the arithmetic never worked. An
  # image built there has to be pushed to a registry and pulled back — 43 to 110
  # seconds of a deploy moving bytes the host is about to have anyway — and the
  # runners are shared, so the same api build took 4.8, 5.5, 5.9 and then 13.8
  # minutes across four consecutive deploys. The variance alone was larger than
  # everything else this workflow spends.
  #
  # This host has twelve cores, a warm layer cache that survives between deploys,
  # and is where the image is needed. Measured on it, the dashboard image builds in
  # 302s against 359-470s on a GitHub runner, and the pull disappears.
  #
  # Building beside the running site was the objection, and it was measured rather
  # than argued: the site answered 200 throughout a full dashboard build, between
  # 0.27 and 0.56 seconds, indistinguishable from idle.
  #
  # `setup-buildx-action` is deliberately absent. It creates a `docker-container`
  # builder with an empty cache, which would throw away the warm daemon cache that
  # makes this fast — the point of building here.
  images:
    name: Build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: [self-hosted, Linux, ci]
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # Plain `docker build`, not `build-push-action`. The action drives buildx,
      # which exports the built image and unpacks it back into the daemon; measured
      # on this host that round trip costs 32 seconds the daemon does not need,
      # because it is the daemon the image was built by and will be run from. The
      # image is left where the deploy looks for it, and the registry copy is made
      # afterwards by `publish`, off the path between a commit and the site.
      - name: Build
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:sha-${{ github.sha }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_ARGS: ${{ matrix.build_args }}
        run: |
          set -euo pipefail

          args=""
          # One `--build-arg` per line of the matrix entry; empty for services with none.
          while IFS= read -r line; do
            [ -n "${line}" ] && args="${args} --build-arg ${line}"
          done <<< "${BUILD_ARGS}"

          # shellcheck disable=SC2086
          docker build --file "${DOCKERFILE}" --tag "${IMAGE_REF}" ${args} .

  deploy:
    name: Start the new stack
    needs: [changes, images]
    if: needs.changes.outputs.any == 'true'
    runs-on: [self-hosted, Linux, deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Have this commit's images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail

          # The build job runs on this same Docker daemon, so an image it just
          # made is already here and there is nothing to fetch. The pull is kept
          # for the case that is not true — a manual re-run of this job alone, or
          # a deploy whose images were built before this workflow moved onto the
          # host — and skipped otherwise.
          missing=""

          for service in ${CHANGED_SERVICES}; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/classroom-${service}:sha-${GITHUB_SHA}"

            if docker image inspect "${ref}" >/dev/null 2>&1; then
              echo "${service}: already on this host"
            else
              missing="${missing} ${service}"
            fi
          done

          missing="$(echo "${missing}" | xargs || true)"
          if [ -z "${missing}" ]; then exit 0; fi

          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

          # Retried once. A pull writes into containerd's ingest area before it
          # commits the layer, and anything sweeping the content store at that
          # moment leaves it with a half-written blob: `commit failed: rename
          # .../ingest/... no such file or directory`. That is what a concurrent
          # docker cleanup did to this deploy, and a second attempt succeeds
          # because the ingest starts again from nothing.
          for service in ${missing}; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/classroom-${service}:sha-${GITHUB_SHA}"

            if ! docker pull --quiet "${ref}"; then
              echo "::warning::Pulling ${ref} failed; retrying once."
              sleep 10
              docker pull --quiet "${ref}"
            fi
          done

          docker logout "${REGISTRY}"

      - name: Start the stack
        env:
          CHANGED_SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail

          # This runner sees the Docker socket but not the host filesystem, so
          # the environment is read through a throwaway container. It is written
          # with a restrictive umask and removed at the end of the job.
          umask 077
          env_file="${RUNNER_TEMP}/production.env"
          docker run --rm -v "${HOST_ENV_DIR}:/cfg:ro" alpine:3 cat /cfg/production.env > "${env_file}"

          test -s "${env_file}"

          # One tag per service, resolved here.
          #
          # A service this push did not change is handed the tag it is already running, so
          # its resolved config is identical and compose leaves the container alone. That is
          # the whole point: a change to the teacher's screen must not restart the API a
          # candidate is sitting an exam through.
          #
          # The tags are exported rather than written into the env file: for interpolation
          # the shell environment beats --env-file. Each container then reports its own
          # commit in `docker ps`, which a tag that moves between deploys cannot do.
          resolve_tag() {
            service="$1"
            container="zj19oe40izga1bnpymfz5z55-${service}-1"

            for changed in ${CHANGED_SERVICES}; do
              if [ "${changed}" = "${service}" ]; then
                echo "sha-${GITHUB_SHA}"
                return
              fi
            done

            # Unchanged: keep exactly what is running, so compose sees an identical config
            # and leaves the container alone.
            running="$(docker inspect --format '{{.Config.Image}}' "${container}" 2>/dev/null || true)"
            case "${running}" in
              *:*) echo "${running##*:}"; return ;;
            esac

            # No container to read a tag from. This commit's tag would be wrong: nothing was
            # built for a service this push did not change, so the pull would fail on a
            # manifest that does not exist. The newest image already on the host is the only
            # honest answer.
            local_tag="$(docker images "${REGISTRY}/${IMAGE_NAMESPACE}/classroom-${service}" \
              --filter 'reference=*:sha-*' --format '{{.CreatedAt}}|{{.Tag}}' | sort -r | head -1 | cut -d'|' -f2)"

            if [ -n "${local_tag}" ]; then
              echo "${local_tag}"
              return
            fi

            echo "::error::No container and no image for ${service}; run this workflow manually to rebuild everything." >&2
            exit 1
          }

          CLASSROOM_API_TAG="$(resolve_tag api)"
          CLASSROOM_DASHBOARD_TAG="$(resolve_tag dashboard)"
          CLASSROOM_JOBS_TAG="$(resolve_tag jobs)"
          export CLASSROOM_API_TAG CLASSROOM_DASHBOARD_TAG CLASSROOM_JOBS_TAG

          echo "api=${CLASSROOM_API_TAG} dashboard=${CLASSROOM_DASHBOARD_TAG} jobs=${CLASSROOM_JOBS_TAG}"

          docker compose \
            --env-file "${env_file}" \
            -f docker/production/docker-compose.yaml \
            --project-directory . \
            --project-name zj19oe40izga1bnpymfz5z55 \
            up -d --no-build --remove-orphans

          rm -f "${env_file}"

      - name: Prove it is serving
        run: |
          set -euo pipefail

          for service in api dashboard; do
            name="zj19oe40izga1bnpymfz5z55-${service}-1"
            for _ in $(seq 1 30); do
              health="$(docker inspect --format '{{.State.Health.Status}}' "${name}" 2>/dev/null || echo missing)"
              [ "${health}" = "healthy" ] && break
              sleep 5
            done
            if [ "${health}" != "healthy" ]; then
              echo "::error::${name} did not become healthy (${health})"
              docker logs --tail 40 "${name}" || true
              exit 1
            fi
            echo "${name}: healthy"
          done

          # Healthy containers are not the same as a served page; ask the tunnel.
          #
          # Retried, because those two facts are seconds apart. A container reports
          # healthy as soon as it answers on localhost, while the tunnel still has to
          # notice the old one is gone and route to the new one. Asking once, four
          # seconds after the dashboard went healthy, failed a deploy that had in fact
          # succeeded — the site was serving the new image by the time anyone looked.
          code=000
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://msna.classroom.io.vn/ || echo 000)"
            [ "${code}" = "200" ] && break
            echo "attempt ${attempt}: HTTP ${code}"
            sleep 5
          done

          if [ "${code}" != "200" ]; then
            echo "::error::The site answered HTTP ${code} after the deploy"
            exit 1
          fi
          echo "Site answered HTTP 200."

      # Only after a healthy deploy: a failed one must leave the previous image
      # exactly where it is, because that is what the host is still running.
      - name: Remove the images this deploy superseded
        if: success()
        env:
          # The running image and the one before it. One is serving; the other is
          # what a rollback would start, and it is already on disk.
          KEEP_PER_REPO: 2
        run: |
          set -euo pipefail

          # Each image is about 5 GB and every commit produces three, so without
          # this the disk gains ~15 GB per deploy. `docker image prune` cannot do
          # it: these images carry tags, and prune only removes untagged ones.
          running="${RUNNER_TEMP}/running-images.txt"
          docker ps --format '{{.Image}}' | sort -u > "${running}"

          for image in classroom-api classroom-dashboard classroom-jobs; do
            repo="${REGISTRY}/${IMAGE_NAMESPACE}/${image}"

            # Newest first, so anything past the keep count is the older tail.
            # `|` separates the fields because a creation date contains spaces.
            docker images "${repo}" --filter 'reference=*:sha-*' --format '{{.CreatedAt}}|{{.Repository}}:{{.Tag}}' \
              | sort -r \
              | cut -d'|' -f2 \
              | tail -n "+$((KEEP_PER_REPO + 1))" > "${RUNNER_TEMP}/stale.txt"

            while read -r ref; do
              [ -n "${ref}" ] || continue

              # Belt and braces: docker refuses to remove an image in use, but
              # saying so plainly beats reading a failed command in the log.
              if grep -qxF "${ref}" "${running}"; then
                echo "keeping ${ref}: a container is running it"
                continue
              fi

              echo "removing ${ref}"
              docker rmi "${ref}" >/dev/null || true
            done < "${RUNNER_TEMP}/stale.txt"
          done

          # Layers orphaned by the removals above.
          docker image prune --force >/dev/null || true
          df -h / | tail -1

  # The registry copy, made after the site is already serving.
  #
  # Nothing on this host needs it: the image was built here and the two most recent
  # per service are kept on disk, which is what a rollback starts. It exists for the
  # case the disk does not — a rebuilt host, a second machine — and for reading what
  # a given commit actually shipped. That is worth minutes of a background job and
  # not one second of the path between a commit and the site.
  #
  # A failure here is reported, not fatal. The deploy it follows has already been
  # proven to serve.
  publish:
    name: Copy the images to the registry
    needs: [changes, deploy]
    if: needs.changes.outputs.any == 'true'
    runs-on: [self-hosted, Linux, ci]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Push
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANGED_SERVICES: ${{ needs.changes.outputs.services }}
        run: |
          set -euo pipefail

          echo "${GHCR_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

          for service in ${CHANGED_SERVICES}; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/classroom-${service}:sha-${GITHUB_SHA}"
            docker push --quiet "${ref}"
            echo "pushed ${ref}"
          done

          docker logout "${REGISTRY}"
