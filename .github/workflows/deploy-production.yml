name: Deploy production

# GitHub cannot call Coolify directly. Cloudflare Access sits in front of the
# public Coolify hostname and answers an unauthenticated webhook with a sign-in
# page, so GitHub records HTTP 200 while Coolify never hears about the push.
#
# This job runs on the runner that lives on the Coolify host and reaches the API
# over the Docker bridge instead, which is already inside the Access perimeter.
# Nothing is built here: Coolify builds the images from the checkout it pulls.
#
# The job then waits for the deployment to reach a terminal state, so a build
# that dies halfway turns this run red instead of passing silently.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: [self-hosted, Linux, deploy]
    # Images are built from source on a spinning disk, which takes the better
    # part of an hour when the layer cache is cold.
    timeout-minutes: 90
    steps:
      - name: Trigger and wait
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: http://172.17.0.1:18080
          APP_UUID: zj19oe40izga1bnpymfz5z55
          POLL_SECONDS: 30
          MAX_POLLS: 170
        run: |
          set -euo pipefail

          if [ -z "${COOLIFY_API_TOKEN}" ]; then
            echo "::error::COOLIFY_API_TOKEN secret is missing"
            exit 1
          fi

          body="$(mktemp)"
          trap 'rm -f "${body}"' EXIT

          code="$(curl -sS -o "${body}" -w '%{http_code}' --max-time 60 \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${APP_UUID}&force=false" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}")"

          if [ "${code}" != "200" ]; then
            echo "::error::Coolify refused the deploy request (HTTP ${code})"
            cat "${body}"
            exit 1
          fi

          uuid="$(jq -r '.deployments[0].deployment_uuid // empty' "${body}")"
          if [ -z "${uuid}" ]; then
            echo "::error::Coolify accepted the request but queued no deployment"
            cat "${body}"
            exit 1
          fi

          echo "Queued deployment ${uuid} for ${GITHUB_SHA}."

          previous=""
          for _ in $(seq 1 "${MAX_POLLS}"); do
            sleep "${POLL_SECONDS}"

            # A single failed poll is not a failed deploy; keep waiting.
            if ! curl -sS -o "${body}" --max-time 30 \
              "${COOLIFY_URL}/api/v1/deployments/${uuid}" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}"; then
              echo "Status request failed, retrying."
              continue
            fi

            status="$(jq -r '.status // empty' "${body}")"
            [ -z "${status}" ] && { echo "No status in response, retrying."; continue; }

            if [ "${status}" != "${previous}" ]; then
              echo "Deployment ${uuid}: ${status}"
              previous="${status}"
            fi

            case "${status}" in
              finished)
                echo "Deployment ${uuid} finished."
                exit 0
                ;;
              failed|error|cancelled-by-user)
                echo "::error::Deployment ${uuid} ended as ${status}. Open it in Coolify for the build log."
                exit 1
                ;;
            esac
          done

          echo "::error::Deployment ${uuid} did not finish within the polling budget; it may still be running in Coolify."
          exit 1
